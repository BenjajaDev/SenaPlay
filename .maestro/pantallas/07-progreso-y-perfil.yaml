# Progreso, menú de perfil, perfil y la hoja de edición.
appId: com.benjajadev.senaplay
---
- runFlow:
    file: ../subflujos/volver-a-pestana.yaml
    env:
      TAB: "Progreso"
- takeScreenshot: ${OUT}/60-progreso
- tapOn: "Abrir menú de perfil"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/61-menu-perfil
- tapOn: "Editar perfil"
- waitForAnimationToEnd
# Editar perfil abre la hoja de edición directamente.
- takeScreenshot: ${OUT}/62-perfil-editar
- tapOn: "Cerrar"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/63-perfil
