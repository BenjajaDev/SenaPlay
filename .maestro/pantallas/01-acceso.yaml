# Acceso (antes de iniciar sesión): inicio de sesión, recuperar y registro.
appId: com.benjajadev.senaplay
---
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/01-inicio-sesion
- tapOn: "Recuperar"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/02-recuperar-contrasena
- tapOn: "Iniciar sesión"
- tapOn: ".*Regístrate.*"
- extendedWaitUntil:
    visible: "Nombre completo \\*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/03-registro
- tapOn: ".*Inicia sesión.*"
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 10000
