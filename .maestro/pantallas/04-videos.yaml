# Videos (solo si la pestaña está activa por flag remoto): la lista o el
# aviso de que aún no hay, y el reproductor si hay al menos uno.
appId: com.benjajadev.senaplay
---
- runFlow:
    when:
      visible: "Videos"
    commands:
      - runFlow:
          file: ../subflujos/volver-a-pestana.yaml
          env:
            TAB: "Videos"
      - extendedWaitUntil:
          notVisible: "Cargando videos"
          timeout: 15000
      - waitForAnimationToEnd
      - takeScreenshot: ${OUT}/30-videos
      - runFlow:
          when:
            visible:
              id: "video-tarjeta"
          commands:
            - tapOn:
                id: "video-tarjeta"
                index: 0
            - extendedWaitUntil:
                notVisible: "Cargando video"
                timeout: 20000
            - takeScreenshot: ${OUT}/31-video-reproductor
            - tapOn: "Volver a la lista de videos"
            - waitForAnimationToEnd
