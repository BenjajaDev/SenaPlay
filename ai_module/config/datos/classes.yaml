# Tipo de cada clase del dataset de VIDEOS (carpetas de data/raw_videos/).
# data/manifest.py lo usa para llenar la columna sign_type del manifiesto.
# Una carpeta que no aparezca aquí se marca como `discarded` con el motivo
# "clase sin tipo en classes.yaml", para no mezclar clases sin revisar.
#
# CONFIRMADO por el autor (2026-09-29):
#   - F es ESTÁTICA (no entra a la comparación temporal).
#   - Las dinámicas del experimento son las 9 clases del modelo TCN ya
#     entrenado (config/dataset_config.yaml). De las primeras pruebas
#     (G, F, X, S, Z), G, X, S y Z son dinámicas.
#
# Agregadas por el autor (2026-11-13): Alergia, Dolor, Mucho y Tengo
# (vocabulario de salud). Dolor junta sus dos variantes (horizontal y vertical)
# en una sola clase. Ñ queda fuera hasta tener más videos.
#
# `ninguna` (2026-11-13) es la clase de rechazo del modelo dinámico
# (model/predict.py: CLASE_SIN_SEÑA). Reemplaza a los negativos sintéticos:
# tramos reales de reposo de los videos originales y letras y números
# estáticos del Club de Sordos de Talca (origen en videos_tesis/ninguna_origen.csv).
dinamicas:
  - ninguna
  - Alergia
  - Dolor
  - G
  - J
  - Mi
  - Mucho
  - Nombre
  - Presento
  - S
  - Tengo
  - X
  - Yo
  - Z

estaticas:
  - F
