# Ruta de niveles y una sesión de nivel (ejercicio, pista y aviso).
appId: com.benjajadev.senaplay
---
- takeScreenshot: ${OUT}/10-niveles
- tapOn: "Nivel 1:.*"
# Los ejercicios se sortean en cada intento: algunos tienen «Verificar» y
# otros (emparejar) se envían solos, por eso se espera la cabecera.
- extendedWaitUntil:
    visible: "Salir del nivel"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/12-nivel-ejercicio
- runFlow:
    when:
      visible: "Ver pista"
    commands:
      - tapOn: "Ver pista"
      - waitForAnimationToEnd
      - takeScreenshot: ${OUT}/13-nivel-pista
      - tapOn: "Cerrar pista"
# Verificar sin responder muestra el aviso amable, sin perder vida.
- runFlow:
    when:
      visible: "Verificar"
    commands:
      - tapOn: "Verificar"
      - waitForAnimationToEnd
      - takeScreenshot: ${OUT}/14-nivel-aviso
- tapOn: "Salir del nivel"
# Si la sesión ya tenía avance, pide confirmación.
- runFlow:
    when:
      visible: "¿Salir del nivel\\?"
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: ${OUT}/15-nivel-confirmar-salida
      - tapOn: "Salir"
- extendedWaitUntil:
    visible: "Ruta de niveles"
    timeout: 10000
- waitForAnimationToEnd
- scroll
- takeScreenshot: ${OUT}/11-niveles-ruta
